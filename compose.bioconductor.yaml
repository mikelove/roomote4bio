services:
  bioconductor:
    image: bioconductor/bioconductor_docker:RELEASE_3_23
    command: >-
      bash -c 'Rscript -e "if (!requireNamespace(\"BiocManager\", quietly = TRUE))
      install.packages(\"BiocManager\", repos = \"https://cloud.r-project.org\");
      BiocManager::install(c(\"DESeq2\", \"tximport\",
      \"tximportData\", \"tximeta\", \"airway\", \"IHW\", \"vsn\",
      \"pheatmap\", \"apeglm\"), ask = FALSE, update = FALSE);
      install.packages(c(\"readr\", \"ashr\"), repos = \"https://cloud.r-project.org\")" && sleep infinity'
    volumes:
      - .:/workspace
    working_dir: /workspace
